<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- Data of each "message" event. th:text escapes the user's input. -->
<li th:fragment="message">
    <span class="text-xs text-gray-400" th:text="|#${message.id} ${message.time}|">#1 12:00:00</span>
    <b class="text-gray-800" th:text="${message.user}">user</b>
    <span class="text-gray-700" th:text="${message.text}">text</span>
</li>

</body>
</html>
