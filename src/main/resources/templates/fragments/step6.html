<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- Returned by POST /step6/jobs. The page reads data-events and opens that stream. -->
<div th:fragment="job" class="border border-gray-200 rounded p-4 space-y-3"
     th:attr="data-events=|/step6/jobs/${jobId}/events|">
    <p class="text-sm text-gray-700">Deploying <b th:text="${version}">1.0.0</b></p>
    <ol class="text-sm space-y-1" data-steps></ol>
    <div data-question></div>
    <div data-done></div>
</div>

<!-- Data of each "step" event -->
<li th:fragment="step" class="text-gray-700">
    <span class="text-green-600">✓</span> <span th:text="${name}">Build</span>
    <span class="text-xs text-gray-400" th:text="${time}">12:00:00</span>
</li>

<!-- Data of the "question" event. The page POSTs data-approved to data-answer when a button is clicked. -->
<div th:fragment="question" class="bg-amber-50 border border-amber-200 rounded p-4 space-y-3">
    <p class="text-sm font-medium text-gray-800">
        Staging looks good. Deploy <b th:text="${version}">1.0.0</b> to production?
    </p>
    <p class="text-xs text-gray-500" th:text="|The job waits up to ${timeoutSeconds} s for an answer.|">The job waits…</p>
    <div class="flex gap-2">
        <button class="bg-slate-700 hover:bg-slate-800 text-white px-4 py-1.5 rounded text-sm"
                th:attr="data-answer=|/step6/jobs/${jobId}/answer|" data-approved="true">
            Approve
        </button>
        <button class="border border-gray-400 bg-white hover:bg-gray-50 px-4 py-1.5 rounded text-sm"
                th:attr="data-answer=|/step6/jobs/${jobId}/answer|" data-approved="false">
            Reject
        </button>
    </div>
</div>

<!-- Response of POST /step6/jobs/{id}/answer -->
<p th:fragment="answered" class="text-sm text-gray-600">
    <span th:if="${accepted}" th:text="${approved} ? 'You approved. Continuing…' : 'You rejected.'">You approved.</span>
    <span th:unless="${accepted}">Too late: this question has already been answered or has expired.</span>
</p>

<!-- Replaces the question when nobody answered in time -->
<p th:fragment="expired" class="text-sm text-gray-600">The question expired.</p>

<!-- Data of the final "done" event -->
<div th:fragment="done" class="rounded p-3 text-sm"
     th:classappend="${success} ? 'bg-green-50 border border-green-200 text-green-800' : 'bg-gray-50 border border-gray-200 text-gray-700'"
     th:text="${message}">
    Done.
</div>

</body>
</html>
