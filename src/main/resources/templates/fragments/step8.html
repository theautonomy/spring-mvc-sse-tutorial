<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- Returned by POST /step8/jobs, and rendered into the page for /step8?job=…. The page connects to data-events,
     and puts data-page in the address bar so a reload finds the job again. -->
<div th:fragment="shell" class="border border-gray-200 rounded p-4"
     th:attr="data-events=|/step8/jobs/${jobId}/events|,data-page=|/step8?job=${jobId}|">
    <p class="text-sm text-gray-500">Connecting…</p>
</div>

<!-- Data of every "state" and the final "done" event. Built only from the database. -->
<div th:fragment="state" class="space-y-4">
    <div class="flex flex-wrap items-center gap-3">
        <span class="text-xs font-semibold px-2 py-0.5 rounded" th:text="${job.status}"
              th:classappend="${job.status.name() == 'DONE'} ? 'bg-green-100 text-green-800'
                            : (${job.status.name() == 'FAILED'} ? 'bg-red-100 text-red-800'
                            : (${job.status.name() == 'CANCELLED'} ? 'bg-gray-200 text-gray-700' : 'bg-blue-100 text-blue-800'))">INSERTING</span>
        <span class="text-xs text-gray-400" th:text="|job ${job.id} · ${job.failureMode}|">job id</span>
        <span th:if="${job.stopRequested != null and !job.status.finished()}" class="text-xs text-amber-700">Stopping…</span>
        <button th:unless="${job.status.finished() or job.stopRequested != null}" th:attr="data-cancel=|/step8/jobs/${job.id}/cancel|"
                class="ml-auto border border-gray-400 bg-white hover:bg-gray-50 px-3 py-1 rounded text-xs">Cancel</button>
    </div>

    <div>
        <p class="text-sm font-semibold text-gray-700 mb-2">
            Action 1 · Insert
            <span class="font-normal text-xs text-gray-500" th:text="|(at most ${maxParallel} batches at once, across all jobs)|"></span>
        </p>
        <div class="space-y-1.5">
            <div th:each="b : ${job.batches}" class="flex items-center gap-3">
                <span class="text-xs text-gray-600 w-14" th:text="|Batch ${b.batch + 1}|">Batch 1</span>
                <span class="text-xs w-20" th:text="${b.status}"
                      th:classappend="${b.status == 'DONE'} ? 'text-green-700' : (${b.status == 'FAILED' or b.status == 'RETRYING'} ? 'text-red-700'
                                    : (${b.status == 'WAITING' or b.status == 'STOPPED'} ? 'text-gray-400' : 'text-blue-700'))">RUNNING</span>
                <div class="flex-1 bg-gray-200 rounded h-2 overflow-hidden">
                    <div class="bg-slate-700 h-2 transition-all duration-300" th:style="|width: ${b.inserted * 100 / rowsPerBatch}%|"></div>
                </div>
                <span class="text-xs text-gray-500 w-24 text-right">
                    <span th:text="|${b.inserted}/${rowsPerBatch}|">25/100</span>
                    <span th:if="${b.attempts > 1}" class="text-red-700" th:text="|· try ${b.attempts}|">· try 2</span>
                </span>
            </div>
        </div>
    </div>

    <div>
        <p class="text-sm font-semibold text-gray-700 mb-2">Action 2 · Process</p>
        <div class="w-full bg-gray-200 rounded h-3 overflow-hidden">
            <div class="bg-green-600 h-3 transition-all duration-300" th:style="|width: ${job.processed * 100 / job.totalRows}%|"></div>
        </div>
        <p class="text-xs text-gray-600 mt-1" th:text="|${job.processed} of ${job.totalRows} records processed|">0 of 600</p>
    </div>

    <div th:if="${job.status.name() == 'DONE'}" class="bg-green-50 border border-green-200 rounded p-3 text-sm text-green-800">
        Done. Database: <b th:text="${summary.records}">600</b> records, <b th:text="${summary.processed}">600</b> processed,
        sum of results <b th:text="${summary.total}">60000</b>.
    </div>
    <div th:if="${job.status.name() == 'FAILED' or job.status.name() == 'CANCELLED'}"
         class="bg-red-50 border border-red-200 rounded p-3 text-sm text-red-800">
        <span th:text="${job.message}">Batch 3 failed.</span>
        Records left in the database: <b th:text="${summary.records}">0</b>.
    </div>
</div>

</body>
</html>
