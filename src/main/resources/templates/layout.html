<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Spring Security rejects a POST without the CSRF token. Forms rendered by Thymeleaf get it as a hidden field
         automatically; fetch calls read it from here and send it as a header. -->
    <!-- th:if: an error page can be rendered without a token, and must not fail because of it -->
    <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}"/>
    <title th:text="|${title} · SSE Tutorial|">SSE Tutorial</title>
    <!-- Styling only. Every page talks to the server with the browser's own EventSource and fetch. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Headers for a fetch POST: {'X-CSRF-TOKEN': '…'}
        function csrfHeaders() {
            const header = document.querySelector('meta[name=_csrf_header]');
            const token = document.querySelector('meta[name=_csrf]');
            return header && token ? {[header.content]: token.content} : {};
        }
    </script>
</head>

<body>

<nav th:fragment="nav(step)" class="bg-slate-800 px-6 py-4 flex flex-wrap items-center gap-x-5 gap-y-2">
    <a href="/" class="text-xl font-bold text-white mr-4">SSE Tutorial</a>
    <a href="/step1" class="text-sm" th:classappend="${step == 1} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">1 Hello world</a>
    <a href="/step2" class="text-sm" th:classappend="${step == 2} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">2 Clock</a>
    <a href="/step3" class="text-sm" th:classappend="${step == 3} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">3 Progress</a>
    <!-- sec:authorize only hides the link. SecurityConfig is what actually protects /step4/** and /step6/**. -->
    <a href="/step4" sec:authorize="hasRole('ADMIN')" class="text-sm" th:classappend="${step == 4} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">4 Dashboard</a>
    <a href="/step5" class="text-sm" th:classappend="${step == 5} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">5 Chat</a>
    <a href="/step6" sec:authorize="hasRole('ADMIN')" class="text-sm" th:classappend="${step == 6} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">6 Approval</a>
    <a href="/step7" class="text-sm" th:classappend="${step == 7} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">7 Pipeline</a>
    <a href="/step8" class="text-sm" th:classappend="${step == 8} ? 'text-white font-semibold' : 'text-slate-400 hover:text-white'">8 Jobs</a>
    <!-- th:action adds the CSRF hidden field to this form -->
    <form th:action="@{/logout}" method="post" class="ml-auto flex items-center gap-3">
        <span class="text-sm text-slate-300" sec:authentication="name">alice</span>
        <button type="submit" class="text-sm text-slate-400 hover:text-white">Log out</button>
    </form>
</nav>

</body>
</html>
